services:
  frontend:
    profiles:
      - disabled

  frontend-dev:
    build:
      context: ./frontend
      target: dependencies
    command: >
      npm start -- --host 0.0.0.0 --poll 1000
      --proxy-config proxy.docker.json
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - app
    networks:
      - rehabitar_net

volumes:
  frontend_node_modules:
