# =============================================================================
# Pruebas del módulo P4 (BDNS) en Docker, sin necesitar Python ni PostgreSQL en el equipo.
#
#   docker compose -f tests/docker-compose.p4-test.yml run --rm tests        # ejecutar
#   docker compose -f tests/docker-compose.p4-test.yml down -v               # limpiar
#
# Opcional, 1 petición real a la API BDNS:
#   PowerShell: $env:RUN_LIVE_BDNS="1"; docker compose -f tests/docker-compose.p4-test.yml run --rm tests
#
# La BD de prueba vive en memoria (tmpfs): se crea vacía en cada arranque y no toca la BD del proyecto.
# =============================================================================
name: rehabitar_p4_tests

services:
  test_db:
    image: postgis/postgis:15-3.4-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: rehabitar_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d rehabitar_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  tests:
    image: python:3.11-slim            # misma versión que los Dockerfiles del proyecto
    working_dir: /app
    volumes:
      - ..:/app                        # monta el repositorio: prueba el código actual sin reconstruir
      - pip_cache:/root/.cache/pip     # acelera las siguientes ejecuciones
    environment:
      TEST_DATABASE_URL: postgresql://test:test@test_db:5432/rehabitar_test
      RUN_LIVE_BDNS: ${RUN_LIVE_BDNS:-0}
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_ROOT_USER_ACTION: ignore
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    depends_on:
      test_db:
        condition: service_healthy
    command: >
      sh -c "pip install -q -r etl/requirements.txt -r backend/requirements.txt &&
             python -m unittest discover -s tests -p 'test_p4*.py' -v"

volumes:
  pip_cache:
