# =============================================================================
# RE-HABITAR PoC - Orquestación Completa Docker Compose (LISTO PARA USAR)
# Arquitectura de Ingesta Híbrida:
#   1) Carga semilla inicial rápida en `etl_runner`
#   2) Hidratación bajo demanda (Read-Through Cache) desde `app` al clicar en el Frontend
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. Servicio de Base de Datos Espacial (PostgreSQL 15 + PostGIS 3.4)
  # ---------------------------------------------------------------------------
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: rehabitar_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rehabitar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rehabitar_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-rehabitar_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rehabitar} -d ${POSTGRES_DB:-rehabitar_db}"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s
    networks:
      - rehabitar_net

  # ---------------------------------------------------------------------------
  # 2. Contenedor Efímero ETL Runner (Carga Semilla Inicial Ligera y Rápida)
  # ---------------------------------------------------------------------------
  etl_runner:
    build:
      context: ./etl
      dockerfile: Dockerfile
    container_name: rehabitar_etl_runner
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rehabitar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rehabitar_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-rehabitar_db}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-rehabitar}:${POSTGRES_PASSWORD:-rehabitar_pwd}@db:5432/${POSTGRES_DB:-rehabitar_db}
      EXTERNAL_API_TIMEOUT: ${EXTERNAL_API_TIMEOUT:-4}
      INITIAL_SEED_CODES: ${INITIAL_SEED_CODES:-28070,28027}
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "run_all.py"]
    networks:
      - rehabitar_net

  # ---------------------------------------------------------------------------
  # 3. Aplicación Backend FastAPI + Ingesta Bajo Demanda + Frontend (Puerto 8000)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: rehabitar_app
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rehabitar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rehabitar_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-rehabitar_db}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATABASE_URL_ASYNC: postgresql+asyncpg://${POSTGRES_USER:-rehabitar}:${POSTGRES_PASSWORD:-rehabitar_pwd}@db:5432/${POSTGRES_DB:-rehabitar_db}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-rehabitar}:${POSTGRES_PASSWORD:-rehabitar_pwd}@db:5432/${POSTGRES_DB:-rehabitar_db}
      EXTERNAL_API_TIMEOUT: ${EXTERNAL_API_TIMEOUT:-4}
      WLC_WEIGHT_DEMO: ${WLC_WEIGHT_DEMO:-0.35}
      WLC_WEIGHT_HEALTH: ${WLC_WEIGHT_HEALTH:-0.30}
      WLC_WEIGHT_GRANTS: ${WLC_WEIGHT_GRANTS:-0.20}
      WLC_WEIGHT_INFRA: ${WLC_WEIGHT_INFRA:-0.15}
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      etl_runner:
        condition: service_completed_successfully
    networks:
      - rehabitar_net

volumes:
  pgdata:
    name: rehabitar_pgdata

networks:
  rehabitar_net:
    name: rehabitar_network
    driver: bridge
